<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0a"><title>VH MEN · Scan QR</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body class="qr-page"><main><div class="brand" style="font-size:34px">VH MEN</div><div class="sub" style="margin-bottom:26px">ATTENDANCE</div><div id="live" hidden><div class="qr-card"><div id="qr"></div></div><div class="bar"><i id="bar"></i></div><h1>Scan to clock in or out<span class="km">ស្កេនដើម្បីចុះវត្តមាន</span></h1><p style="color:var(--muted)">Open your phone camera and scan this live code.</p></div><div id="message">Connecting…</div><div id="clock" style="margin-top:18px"></div><div id="label" class="foot"></div></main><script src="config.js"></script><script src="api.js"></script><script>
(function(){var token=new URLSearchParams(location.search).get('d')||'',code='',qr=null,end=0,ttl=30,timer=null,offset=0,$=function(id){return document.getElementById(id)};function msg(v){$('live').hidden=true;$('message').hidden=false;$('message').textContent=v}function scanUrl(c){var u=new URL('index.html',location.href);u.search='?scan='+encodeURIComponent(c);return u.href}function render(d){if(typeof QRCode==='undefined')return msg('QR library did not load. Check the internet and reload.');if(d.code!==code){if(!qr)qr=new QRCode($('qr'),{text:scanUrl(d.code),width:380,height:380,colorDark:'#0b0b0a',colorLight:'#f2ead9',correctLevel:QRCode.CorrectLevel.M});else qr.makeCode(scanUrl(d.code));code=d.code}ttl=d.ttl;end=Date.now()+d.remaining*1000;$('message').hidden=true;$('live').hidden=false}function poll(){clearTimeout(timer);VH.call('qrDisplayState',token).then(function(r){if(!r.ok){msg(r.error||'This QR screen is not registered.');return}var d=r.data;offset=d.serverTime-Date.now();$('label').textContent='QR screen: '+d.name;if(d.mode==='OFF'){msg('QR check is turned off.');timer=setTimeout(poll,60000);return}render(d);timer=setTimeout(poll,3000)}).catch(function(){msg('No connection — reconnecting…');timer=setTimeout(poll,5000)})}setInterval(function(){$('clock').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Phnom_Penh',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(Date.now()+offset));if(code)$('bar').firstElementChild.style.width=(100*Math.max(0,end-Date.now())/(ttl*1000))+'%'},250);if(!token)msg('This QR screen link is missing its display token.');else poll()})();
</script></body></html>
